<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Patient List</h2>
    <a href="/patients/new" class="btn btn-primary mb-3">Add New Patient</a>
    <a href="/" class="btn btn-secondary mb-3">Back to Home</a>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.firstName}">John</td>
            <td th:text="${p.lastName}">Doe</td>
            <td th:text="${p.gender}">M</td>
            <td th:text="${p.phone}">1234567890</td>
            <td th:text="${p.email}">john@email.com</td>
            <td>
                <a th:href="@{/patients/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/patients/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this patient?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${patients.isEmpty()}">
            <td colspan="7" class="text-center">No patients found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
