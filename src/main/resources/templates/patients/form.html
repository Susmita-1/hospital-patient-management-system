<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${patient.id} ? 'Edit Patient' : 'Add New Patient'">Add Patient</h2>
    <form th:action="@{/patients}" th:object="${patient}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">

        <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" th:field="*{firstName}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" th:field="*{lastName}" required>
        </div>

        <div class="col-md-4">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" th:field="*{dateOfBirth}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Gender</label>
            <select class="form-select" th:field="*{gender}">
                <option value="M">Male</option>
                <option value="F">Female</option>
                <option value="O">Other</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" th:field="*{phone}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" th:field="*{address}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Emergency Contact Name</label>
            <input type="text" class="form-control" th:field="*{emergencyContactName}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Emergency Contact Phone</label>
            <input type="text" class="form-control" th:field="*{emergencyContactPhone}">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">Save</button>
            <a href="/patients" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
