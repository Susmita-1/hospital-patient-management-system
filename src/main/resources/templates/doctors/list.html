<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Doctor List</h2>
    <a href="/doctors/new" class="btn btn-primary mb-3">Add New Doctor</a>
    <a href="/" class="btn btn-secondary mb-3">Back to Home</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Specialty</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${doctors}">
            <td th:text="${d.id}">1</td>
            <td th:text="${d.firstName}">Dr.</td>
            <td th:text="${d.lastName}">Smith</td>
            <td th:text="${d.specialty}">Cardiology</td>
            <td th:text="${d.phone}">1234567890</td>
            <td th:text="${d.email}">dr@email.com</td>
            <td>
                <a th:href="@{/doctors/edit/{id}(id=${d.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/doctors/delete/{id}(id=${d.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this doctor?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${doctors.isEmpty()}">
            <td colspan="7" class="text-center">No doctors found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
