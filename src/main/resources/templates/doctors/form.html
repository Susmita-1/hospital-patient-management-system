<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${doctor.id} ? 'Edit Doctor' : 'Add New Doctor'">Add Doctor</h2>
    <form th:action="@{/doctors}" th:object="${doctor}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">

        <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" th:field="*{firstName}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" th:field="*{lastName}" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Specialty</label>
            <input type="text" class="form-control" th:field="*{specialty}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Qualification</label>
            <input type="text" class="form-control" th:field="*{qualification}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" th:field="*{phone}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">Save</button>
            <a href="/doctors" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
