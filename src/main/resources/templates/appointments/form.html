<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Schedule Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Schedule Appointment</h2>
    <form th:action="@{/appointments}" method="post" class="row g-3">
        <input type="hidden" name="patientId" th:value="${appointment.patient.id}">
        <input type="hidden" name="doctorId" th:value="${appointment.doctor.id}">

        <div class="col-md-6">
            <label class="form-label">Patient</label>
            <select class="form-select" name="patientId" required>
                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.firstName} + ' ' + ${p.lastName}"></option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Doctor</label>
            <select class="form-select" name="doctorId" required>
                <option th:each="d : ${doctors}" th:value="${d.id}" th:text="'Dr. ' + ${d.firstName} + ' ' + ${d.lastName}"></option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Appointment Date & Time</label>
            <input type="datetime-local" class="form-control" name="appointmentDate" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Reason</label>
            <input type="text" class="form-control" name="reason">
        </div>

        <div class="col-md-12">
            <label class="form-label">Notes</label>
            <textarea class="form-control" name="notes" rows="3"></textarea>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">Schedule</button>
            <a href="/appointments" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
