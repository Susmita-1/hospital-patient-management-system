<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Appointment List</h2>
    <a href="/appointments/new" class="btn btn-primary mb-3">Schedule Appointment</a>
    <a href="/" class="btn btn-secondary mb-3">Back to Home</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Date/Time</th>
            <th>Status</th>
            <th>Reason</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.id}">1</td>
            <td th:text="${a.patient.firstName} + ' ' + ${a.patient.lastName}">John Doe</td>
            <td th:text="'Dr. ' + ${a.doctor.firstName} + ' ' + ${a.doctor.lastName}">Dr. Smith</td>
            <td th:text="${#temporals.format(a.appointmentDate, 'yyyy-MM-dd HH:mm')}">2026-09-10 10:00</td>
            <td th:text="${a.status}">SCHEDULED</td>
            <td th:text="${a.reason}">Routine checkup</td>
            <td>
                <a th:href="@{/appointments/delete/{id}(id=${a.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Cancel this appointment?')">Cancel</a>
            </td>
        </tr>
        <tr th:if="${appointments.isEmpty()}">
            <td colspan="7" class="text-center">No appointments found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
