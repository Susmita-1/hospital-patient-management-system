# Application name (change if needed)
spring.application.name=hospital-patient-management-system

# MySQL Database Configuration (TEMPLATE – fill in your own credentials)
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&serverTimezone=UTC
